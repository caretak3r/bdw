name: Release-plz

# Fully automatic semantic-versioning pipeline, gated on CI passing on main:
#   1. Triggers only after the CI workflow (fmt/clippy/test) finishes
#      successfully on main — a broken build/test never gets released.
#   2. `release-plz update` computes the next version + CHANGELOG.md entry
#      from Conventional Commits and commits it straight to main. (A PR +
#      auto-merge round trip was tried first, but a merge performed with
#      GITHUB_TOKEN never re-triggers workflows on GitHub, so the follow-up
#      release step would never run. Committing directly in the same job
#      sidesteps that limitation entirely — no PAT required.)
#   3. `release-plz release` cuts the git tag + GitHub Release for that
#      version.
#   4. build-binaries fans out once the release exists and attaches
#      prebuilt binaries for macOS (arm64/x86_64) and Linux (x86_64).
# No manual `git tag`, PR review, or release step is ever needed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'caretak3r' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install release-plz
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall release-plz@0.3.165 --no-confirm --force
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version and changelog
        id: update
        run: |
          set -euo pipefail
          release-plz update
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit version bump
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          git add -A
          git commit -m "chore: release v${version}"
          git push origin HEAD:main
      - name: Cut release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output=$(release-plz release --git-token "$GITHUB_TOKEN" -o json)
          echo "release output: $output"
          releases=$(echo "$output" | jq -c '.releases')
          count=$(echo "$releases" | jq 'length')
          if [ "$count" != "0" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(echo "$releases" | jq -r '.[0].tag')" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build binaries (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="bdw-${{ needs.release.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/bdw" "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            bdw-*.tar.gz
            bdw-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
